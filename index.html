<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Time Log">
  
  <link rel="icon" href="data:,">
  <title>Time Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden fixed inset-0">
  <div id="root" class="w-full h-full absolute inset-0"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    function App() {
      const fileInputRef = useRef(null);
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      
      const [imageObj, setImageObj] = useState(null); 
      const [stampDate, setStampDate] = useState(new Date()); 
      const [showSettings, setShowSettings] = useState(false);
      const [stampColor, setStampColor] = useState('#ffffff');
      const [zoom, setZoom] = useState(1);
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const dragRef = useRef({ isDragging: false, startX: 0, startY: 0, startOffsetX: 0, startOffsetY: 0 });
      const [savedImage, setSavedImage] = useState(null);

      const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

      const getClampedOffset = useCallback((targetOffset, targetZoom) => {
        if (!imageObj) return { x: 0, y: 0 };
        const minSourceDim = Math.min(imageObj.width, imageObj.height);
        const cw = minSourceDim / targetZoom; 
        const maxX = (imageObj.width - cw) / 2;
        const maxY = (imageObj.height - cw) / 2;
        return {
          x: clamp(targetOffset.x, -maxX, maxX),
          y: clamp(targetOffset.y, -maxY, maxY)
        };
      }, [imageObj]);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            setImageObj(img);
            setStampDate(new Date()); 
            setZoom(1);
            setOffset({ x: 0, y: 0 });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      const getFormattedDate = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const weekday = date.toLocaleDateString('ko-KR', { weekday: 'short' });
        return `${year}년 ${month}월 ${day}일 (${weekday})`;
      };
      
      const getFormattedTime = (date) => {
        return date.toLocaleTimeString('ko-KR', { hour12: true, hour: 'numeric', minute: '2-digit' });
      };

      const handleZoomChange = (e) => {
        const newZoom = parseFloat(e.target.value);
        setZoom(newZoom);
        setOffset(prev => getClampedOffset(prev, newZoom));
      };

      const handlePointerDown = (e) => {
        if (!imageObj) return;
        dragRef.current = {
          isDragging: true,
          startX: e.clientX,
          startY: e.clientY,
          startOffsetX: offset.x,
          startOffsetY: offset.y
        };
        e.target.setPointerCapture(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (!dragRef.current.isDragging || !imageObj || !containerRef.current) return;
        const dx = e.clientX - dragRef.current.startX;
        const dy = e.clientY - dragRef.current.startY;
        const minSourceDim = Math.min(imageObj.width, imageObj.height);
        const cw = minSourceDim / zoom;
        const displayWidth = containerRef.current.getBoundingClientRect().width;
        const scaleDisplay = displayWidth / cw;
        const newOffsetX = dragRef.current.startOffsetX + (dx / scaleDisplay);
        const newOffsetY = dragRef.current.startOffsetY + (dy / scaleDisplay);
        setOffset(getClampedOffset({ x: newOffsetX, y: newOffsetY }, zoom));
      };

      const handlePointerUp = (e) => {
        dragRef.current.isDragging = false;
        e.target.releasePointerCapture(e.pointerId);
      };

      useEffect(() => {
        if (!imageObj || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const minSourceDim = Math.min(imageObj.width, imageObj.height);
        const cOut = Math.min(minSourceDim, 4000); 
        canvas.width = cOut;
        canvas.height = cOut;
        
        const cw = minSourceDim / zoom;
        const cx = imageObj.width / 2 - offset.x;
        const cy = imageObj.height / 2 - offset.y;
        const sx = cx - cw / 2;
        const sy = cy - cw / 2;

        ctx.clearRect(0, 0, cOut, cOut);
        ctx.drawImage(imageObj, sx, sy, cw, cw, 0, 0, cOut, cOut);

        const dateFontSize = Math.max(24, cOut * 0.045);
        const logoFontSize = Math.max(20, cOut * 0.035);

        ctx.fillStyle = stampColor;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
        ctx.shadowBlur = cOut * 0.008;
        ctx.shadowOffsetX = cOut * 0.003;
        ctx.shadowOffsetY = cOut * 0.003;
        ctx.textBaseline = 'bottom';

        ctx.textAlign = 'left';
        ctx.font = `bold ${dateFontSize}px sans-serif`;
        const paddingX = cOut * 0.05;
        const paddingY = cOut * 0.05;
        const lineSpacing = dateFontSize * 1.3;

        ctx.fillText(getFormattedTime(stampDate), paddingX, cOut - paddingY);
        ctx.fillText(getFormattedDate(stampDate), paddingX, cOut - paddingY - lineSpacing);

        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.font = `bold ${logoFontSize}px sans-serif`;
        ctx.fillText('Time Log', cOut - paddingX, paddingY);

      }, [imageObj, stampDate, stampColor, zoom, offset]);

      const downloadPhoto = (e) => {
        e.preventDefault();
        if (!canvasRef.current) return;
        
        // 아이폰 갤러리 저장을 위해 강제 다운로드를 빼고, 팝업만 띄우도록 수정
        canvasRef.current.toBlob((blob) => {
          if (!blob) return;
          const objectUrl = URL.createObjectURL(blob);
          setSavedImage(objectUrl); 
        }, 'image/jpeg', 0.95);
      };

      const closeModal = () => {
        if (savedImage) URL.revokeObjectURL(savedImage);
        setSavedImage(null);
      };

      return (
        <div className="h-full w-full flex flex-col relative">
          <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept="image/*" className="hidden" />

          <header className="pt-12 pb-4 px-4 flex justify-between items-center z-20 bg-gray-900 shadow-md shrink-0">
            <h1 className="text-xl font-bold flex items-center">
              <span className="mr-2 text-2xl">📸</span> 1:1 Photo Stamp
            </h1>
            {imageObj && (
              <button type="button" onClick={() => setShowSettings(!showSettings)} className={`p-2 rounded-full transition-all text-xl ${showSettings ? 'bg-blue-600' : 'bg-gray-800 hover:bg-gray-700'}`}>
                ⚙️
              </button>
            )}
          </header>

          {showSettings && imageObj && (
            <div className="absolute top-24 right-4 z-30 bg-gray-800/95 backdrop-blur-md p-5 rounded-2xl shadow-2xl w-64 border border-gray-700">
              <div className="flex justify-between items-center mb-5">
                <h2 className="font-semibold text-gray-200">스탬프 색상</h2>
                <button type="button" onClick={() => setShowSettings(false)} className="text-xl">❌</button>
              </div>
              <div className="flex gap-3">
                {['#ffffff', '#ffcc00', '#ff3366', '#00e676', '#000000'].map(color => (
                  <button key={color} type="button" onClick={() => setStampColor(color)} className={`w-8 h-8 rounded-full border-2 ${stampColor === color ? 'border-blue-500 scale-110' : 'border-transparent'}`} style={{ backgroundColor: color }} />
                ))}
              </div>
            </div>
          )}

          <div className="flex-1 flex flex-col items-center justify-center bg-black p-4 relative overflow-hidden">
            {!imageObj ? (
              <div className="text-center">
                <button type="button" onClick={() => { if(fileInputRef.current) fileInputRef.current.click(); }} className="w-32 h-32 mx-auto rounded-3xl border-2 border-dashed border-gray-600 flex flex-col items-center justify-center text-gray-400 hover:text-white hover:bg-gray-800">
                  <span className="text-4xl mb-2">📤</span>
                  <span className="font-medium">사진 선택</span>
                </button>
              </div>
            ) : (
              <div className="w-full max-w-md flex flex-col items-center gap-4 h-full justify-center">
                <div className="text-gray-400 text-sm flex items-center mb-1 animate-pulse shrink-0">
                  ✋ 사진을 드래그하여 위치 조정
                </div>
                <div ref={containerRef} className="w-full aspect-square bg-gray-800 rounded-lg overflow-hidden shadow-2xl border border-gray-800 cursor-move touch-none shrink-0">
                  <canvas ref={canvasRef} onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerLeave={handlePointerUp} onPointerCancel={handlePointerUp} className="w-full h-full block" />
                </div>
                <div className="w-full bg-gray-800/50 p-4 rounded-xl flex items-center gap-3 shrink-0">
                  <span>➖</span>
                  <input type="range" min="1" max="3" step="0.01" value={zoom} onChange={handleZoomChange} className="w-full h-1.5 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                  <span>➕</span>
                </div>
              </div>
            )}
          </div>

          <div className="bg-gray-900 border-t border-gray-800 pb-10 pt-4 px-6 flex justify-center items-center z-20 w-full gap-6 shrink-0">
            {imageObj && (
              <React.Fragment>
                <button type="button" onClick={() => { if(fileInputRef.current) fileInputRef.current.click(); }} className="flex flex-col items-center text-gray-400 flex-1 max-w-[100px]">
                  <div className="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center mb-1 text-xl">🖼️</div>
                  <span className="text-xs">다른 사진</span>
                </button>
                <button type="button" onClick={downloadPhoto} className="flex flex-col items-center text-blue-400 flex-1 max-w-[100px]">
                  <div className="w-16 h-16 rounded-full bg-blue-600 text-white flex items-center justify-center mb-1 shadow-lg text-2xl">✨</div>
                  <span className="text-sm font-bold">완성하기</span>
                </button>
              </React.Fragment>
            )}
          </div>

          {savedImage && (
            <div className="absolute inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-6 backdrop-blur-sm">
              <div className="text-center mb-4">
                <p className="text-yellow-400 font-bold text-lg animate-bounce">👇 아래 사진을 길게 누르세요 👇</p>
              </div>
              
              {/* WebkitTouchCallout을 default로 풀어주어 아이폰에서 길게 눌렀을 때 저장 메뉴가 무조건 뜨게 함 */}
              <img 
                src={savedImage} 
                alt="완성" 
                className="w-full max-w-md rounded-xl shadow-2xl mb-6 object-contain max-h-[60vh] pointer-events-auto" 
                style={{ WebkitTouchCallout: 'default' }}
              />
              
              <div className="text-center bg-gray-800/80 p-4 rounded-xl border border-gray-700 mb-6 shrink-0 w-full max-w-md">
                <p className="text-gray-300 text-sm">사진을 꾹 누른 뒤 <span className="text-white font-bold">[사진 앱에 저장]</span>을 선택하시면 갤러리에 저장됩니다.</p>
              </div>
              <button type="button" onClick={closeModal} className="px-10 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-full shrink-0">닫기</button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
